name: IndexNow ping

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  workflow_dispatch:
    inputs:
      after:
        description: Commit SHA on main; ping the range <after>..HEAD
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ping:
    name: Notify IndexNow of changed URLs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'dynamic') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Submit changed sitemap URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INDEXNOW_AFTER: ${{ github.event.workflow_run.head_sha }}
          INDEXNOW_BEFORE: ${{ inputs.after }}
        run: python3 tools/indexnow.py --submit
